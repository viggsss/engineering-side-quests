<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Magnetic track mouse control loop</title>
  <desc id="desc">The two pickup coils feed signal conditioning, an Arduino proportional controller and differential PWM motors.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#57e389"/><stop offset="1" stop-color="#57c7ff"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#8aa0b8"/></marker></defs>
  <rect width="1100" height="360" rx="24" fill="#0b1422"/>
  <text x="550" y="55" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial" font-size="30" font-weight="700">20 kHz TRACK-FOLLOWING LOOP</text>
  <g font-family="Inter,Arial" font-size="19" text-anchor="middle">
    <g><rect x="55" y="125" width="170" height="105" rx="16" fill="#14243a" stroke="#57e389" stroke-width="3"/><text x="140" y="165" fill="#f8fafc">LEFT + RIGHT</text><text x="140" y="195" fill="#a9bad0">pickup coils</text></g>
    <g><rect x="285" y="125" width="190" height="105" rx="16" fill="#14243a" stroke="#6edbb7" stroke-width="3"/><text x="380" y="165" fill="#f8fafc">BAND-PASS</text><text x="380" y="195" fill="#a9bad0">+ peak detect</text></g>
    <g><rect x="535" y="110" width="205" height="135" rx="16" fill="#14243a" stroke="url(#g)" stroke-width="3"/><text x="637" y="155" fill="#f8fafc">ARDUINO</text><text x="637" y="185" fill="#a9bad0">error = L - R</text><text x="637" y="215" fill="#a9bad0">PWM ± Kp·error</text></g>
    <g><rect x="800" y="125" width="235" height="105" rx="16" fill="#14243a" stroke="#57c7ff" stroke-width="3"/><text x="917" y="165" fill="#f8fafc">DIFFERENTIAL</text><text x="917" y="195" fill="#a9bad0">motor drive</text></g>
  </g>
  <g fill="none" stroke="#8aa0b8" stroke-width="4" marker-end="url(#a)"><path d="M225 178h50"/><path d="M475 178h50"/><path d="M740 178h50"/></g>
  <path d="M918 245c0 70-690 70-690 5" fill="none" stroke="#334a64" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/>
  <text x="570" y="324" text-anchor="middle" fill="#70869e" font-family="ui-monospace,Menlo,monospace" font-size="17">steering changes what the coils see next</text>
</svg>
